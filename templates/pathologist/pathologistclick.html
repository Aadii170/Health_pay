{% extends 'hospital/homebase.html' %}

{% block content %}

<head>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #f9fbfd;
  }

  /* Welcome Section */
  .pathologist-welcome {
    max-width: 700px;
    margin: 100px auto;
    background: white;
    padding: 50px 30px;
    border-radius: 20px;
    box-shadow: 0px 8px 25px rgba(0,0,0,0.08);
    text-align: center;
    animation: fadeIn 1s ease-in-out;
  }

  .pathologist-welcome h1 {
    font-size: 2.5rem;
    font-weight: 700;
    color: #6c5ce7; /* Distinct purple tone for Pathologist */
    margin-bottom: 15px;
  }

  .pathologist-welcome p.lead {
    font-size: 1.1rem;
    color: #555;
    margin-bottom: 25px;
  }

  .pathologist-welcome hr {
    width: 60%;
    border-top: 2px solid #6c5ce7;
    margin: 20px auto;
  }

  /* Buttons */
  .pathologist-btn {
    display: inline-block;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 50px;
    text-decoration: none;
    margin: 8px;
    transition: all 0.3s ease;
  }

  .btn-register {
    background: #6c5ce7;
    color: white;
    box-shadow: 0px 4px 15px rgba(108, 92, 231, 0.4);
  }
  .btn-register:hover {
    background: #5a4bd6;
    transform: translateY(-2px);
  }

  .btn-login {
    background: white;
    color: #6c5ce7;
    border: 2px solid #6c5ce7;
  }
  .btn-login:hover {
    background: #6c5ce7;
    color: white;
    transform: translateY(-2px);
  }

  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<div class="pathologist-welcome">
  <h1>Hello, Pathologist</h1>
  <p class="lead">Welcome to Hospital Management System.</p>
  <hr>
  <p>You can access various features after Login/SignUp.</p>
  <a class="pathologist-btn btn-register" href="/pathologist/pathologistsignup"><i class="fas fa-user-plus"></i> Register Your Account</a>
  <a class="pathologist-btn btn-login" href="/pathologist/pathologistlogin"><i class="fas fa-sign-in-alt"></i> Login</a>
</div>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

{% endblock content %}
