<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

  <style>
    /* Smooth shadow under navbar */
    .navbar {
      background: linear-gradient(90deg, #008cff, #00c3ff);
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    /* Brand styling */
    .navbar-brand {
      font-size: 1.3rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar-brand i {
      font-size: 1.3rem;
    }

    /* Nav links */
    .nav-link {
      font-weight: 500;
      color: white !important;
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      color: #f8f9fa !important;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      padding-left: 10px;
      padding-right: 10px;
    }

    /* Responsive fix */
    .navbar-toggler {
      border: none;
      outline: none;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='white' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-dark fixed-top">
    <a href="/" class="navbar-brand">
      <i class="fas fa-hospital"></i> Hospital Management
    </a>
    <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
      <div class="navbar-nav">
        <a href="/adminclick" class="nav-item nav-link"><i class="fas fa-user-shield"></i> Admin</a>
        <a href="/doctorclick" class="nav-item nav-link"><i class="fas fa-user-md"></i> Doctor</a>
        <a href="/patientclick" class="nav-item nav-link"><i class="fas fa-procedures"></i> Patient</a>
        <a href="/pathologistclick" class="nav-item nav-link"><i class="fas fa-vials"></i> Pathologist</a>
      </div>

      <div class="navbar-nav">
        <a href="/aboutus" class="nav-item nav-link"><i class="fas fa-info-circle"></i> About Us</a>
        <a href="/contactus" class="nav-item nav-link"><i class="fas fa-envelope"></i> Contact Us</a>
      </div>
    </div>
  </nav>
</body>
</html>
